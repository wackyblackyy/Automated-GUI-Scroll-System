# Secret Shop scanner configuration.
#
# All coordinates under `layout` are in REFERENCE pixels: the 1852x1040
# screenshot the templates were cropped from. At runtime the bot finds the
# "Secret Shop" HUD title on screen, measures how much bigger/smaller your
# game window is, and maps these numbers onto your screen automatically.

# Which monitor to capture (1 = primary; see `python -m shop_bot monitors`).
monitor: 1

# Items to look for. Add more entries to hunt for other items.
targets:
  - name: Covenant Bookmarks
    template: templates/covenant_bookmarks.png
    threshold: 0.80
  - name: Mystic Medals
    template: templates/mystic_medals.png
    threshold: 0.80

templates:
  hud: templates/hud_secret_shop.png          # "< Secret Shop" title incl. back arrow (so it can't match "Secret Shop Level 13")
  buy_button: templates/buy_button.png        # "1/1" pill of an item's Buy button (absent once sold)
  refresh_button: templates/refresh_button.png
  # Blue "Confirm" button of the popups. confirm_refresh.png comes from the
  # "Use Skystone to refresh?" screenshot; if confirm_buy.png is missing the
  # same button is tried, and with auto_learn_popups the purchase popup's
  # button is saved automatically the first time. Manual alternative:
  # `python -m shop_bot capture --crop confirm_buy`.
  confirm_buy: templates/confirm_buy.png
  confirm_refresh: templates/confirm_refresh.png

thresholds:
  hud: 0.70
  buttons: 0.75

# Scales searched when locating the HUD for the first time (1.0 = 1852 px wide game).
calibration_scales: {min: 0.35, max: 2.0, step: 0.05}

layout:
  hud_anchor: [25, 18]              # top-left of the HUD template ("< Secret Shop") in the reference shot
  list_region: [620, 90, 1815, 1040]  # x1, y1, x2, y2 of the scrolling item list
  icon_column_x: [760, 980]         # x-range of the item icons inside the list
  refresh_region: [0, 850, 620, 1040]  # bottom-left corner holding the Refresh button
  buy_click_offset: [180, 29]       # where "Buy" is, relative to the top-left of the "1/1" match

scroll:
  method: drag              # "drag" (emulators / touch UIs) or "wheel"
  drag_from: 0.85           # fraction of list height where the drag starts
  drag_to: 0.15             # ... and ends (one long flick covers the 6-item list)
  drag_duration: 0.15       # seconds; short = quick flick
  wheel_clicks: -10
  settle: 0.3               # wait after scrolling before the next screenshot
  max_scrolls: 8            # safety cap of flicks per page; refreshes anyway when reached

actions:
  buy: true                 # click Buy (and confirm) on every target item found
  refresh: true             # refresh the shop after each full scan
  max_refreshes: 50         # each refresh costs 3 skystones -> 50 refreshes = 150 skystones
  auto_learn_popups: true   # template doesn't match? find the popup's blue/green button and save it
  click_delay: 0.35         # wait after each click
  popup_timeout: 4.0        # how long to wait for a confirmation popup

log_csv: shop_log.csv       # one line per item found; set to "" to disable
